<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Изолированный чат с агентом" />
    <title>Rubik Agent Chat</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="chat-shell">
      <aside class="sidebar">
        <a class="brand" href="/"><span>◇</span> Rubik Agent Chat</a>
        <button id="new-session" class="primary" type="button">＋ Новый чат</button>
        <nav id="sessions" aria-label="Сессии чата"></nav>
        <button id="clear-database" class="danger" type="button">Очистить историю</button>

        <p class="memory-note">Агент видит только сообщения текущего чата и не имеет доступа к коду или окружению.</p>
      </aside>

      <section class="conversation" aria-labelledby="chat-title">
        <header>
          <div>
            <p class="eyebrow">CODE-ISOLATED AGENT CHAT</p>
            <h1 id="chat-title">Новый чат</h1>
          </div>
          <span id="status" role="status">Подключение…</span>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <div class="empty">
            <span>✦</span>
            <h2>Чем помочь?</h2>
            <p>Каждая сессия имеет собственную историю диалога.</p>
          </div>
        </div>

        <form id="message-form">
          <textarea
            id="message-input"
            rows="2"
            maxlength="12000"
            placeholder="Напишите сообщение…"
            aria-label="Сообщение агенту"
            required
          ></textarea>
          <button class="primary" type="submit">Отправить</button>
        </form>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
